name: Update GDELT Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  update-gdelt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GDELT data
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          topics = {
              "Economic": '"economic" OR "recession" OR "GDP" OR "interest rate"',
              "Geopolitics": '"geopolitics" OR "sanctions" OR "diplomatic"',
              "Technology": '"technology" OR "semiconductor" OR "robotics"',
              "Energy": '"energy" OR "oil price" OR "natural gas"',
              "War & Conflict": '"war" OR "armed conflict" OR "military"',
              "Inflation": '"inflation" OR "consumer prices" OR "cost of living"',
              "AI": '"artificial intelligence" OR "generative AI" OR "machine learning"'
          }

          output_file = "data/gdelt.json"

          # 读取上一次的数据。
          # 即使本次某个主题失败，也保留之前成功的数据。
          try:
              with open(output_file, "r", encoding="utf-8") as f:
                  previous = json.load(f)
          except Exception:
              previous = {
                  "updated_at": None,
                  "source": "GDELT DOC 2.0",
                  "timespan": "7d",
                  "topics": {}
              }

          if "topics" not in previous:
              previous["topics"] = {}

          results = previous["topics"].copy()

          def fetch_topic(topic, query):

              print("")
              print("=" * 60)
              print(f"Fetching: {topic}")
              print("=" * 60)

              params = urllib.parse.urlencode({
                  "query": query,
                  "mode": "timelinevolraw",
                  "timespan": "7d",
                  "format": "json"
              })

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc?"
                  + params
              )

              max_attempts = 4

              for attempt in range(1, max_attempts + 1):

                  print(
                      f"Attempt {attempt}/{max_attempts}"
                  )

                  try:

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                                  "Mozilla/5.0 Psychohistory/0.2"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          raw = response.read()

                      # 先确认返回内容不是明显的 HTML。
                      text = raw.decode(
                          "utf-8",
                          errors="replace"
                      ).strip()

                      if not text.startswith("{"):
                          raise ValueError(
                              "GDELT returned non-JSON response"
                          )

                      data = json.loads(text)

                      points = []

                      timeline = data.get("timeline")

                      if (
                          isinstance(timeline, list)
                          and len(timeline) > 0
                      ):

                          series = timeline[0]

                          if isinstance(series, dict):

                              series_data = series.get(
                                  "data",
                                  []
                              )

                              if isinstance(
                                  series_data,
                                  list
                              ):
                                  points = series_data

                      if len(points) == 0:
                          raise ValueError(
                              "No timeline data returned"
                          )

                      print(
                          f"SUCCESS: {len(points)} points"
                      )

                      return {
                          "success": True,
                          "points": points,
                          "updated_at": datetime.now(
                              timezone.utc
                          ).isoformat()
                      }

                  except urllib.error.HTTPError as e:

                      print(
                          f"HTTP ERROR {e.code}: {e.reason}"
                      )

                      if e.code == 429:

                          wait_time = 60 * attempt

                          print(
                              f"Rate limited. "
                              f"Waiting {wait_time} seconds..."
                          )

                          time.sleep(wait_time)
                          continue

                      if e.code >= 500:

                          wait_time = 30 * attempt

                          print(
                              f"Server error. "
                              f"Waiting {wait_time} seconds..."
                          )

                          time.sleep(wait_time)
                          continue

                      break

                  except Exception as e:

                      print(
                          f"ERROR: {type(e).__name__}: {e}"
                      )

                      if attempt < max_attempts:

                          wait_time = 30 * attempt

                          print(
                              f"Retrying in "
                              f"{wait_time} seconds..."
                          )

                          time.sleep(wait_time)

                      else:
                          print(
                              "All attempts failed."
                          )

              return None

          success_count = 0

          for index, (topic, query) in enumerate(
              topics.items()
          ):

              result = fetch_topic(topic, query)

              if result is not None:

                  results[topic] = result
                  success_count += 1

              else:

                  # 保留旧数据。
                  if topic in results:

                      print(
                          f"{topic}: keeping previous data"
                      )

                  else:

                      results[topic] = {
                          "success": False,
                          "points": []
                      }

              # 非常重要：
              # 每个主题之间主动等待，降低 API 限流概率。
              if index < len(topics) - 1:

                  print(
                      "Waiting 15 seconds before next topic..."
                  )

                  time.sleep(15)

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "source": "GDELT DOC 2.0",

              "timespan": "7d",

              "topics": results,

              "success_count": success_count,

              "total_topics": len(topics)
          }

          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("=" * 60)
          print(
              f"Completed: "
              f"{success_count}/{len(topics)} topics"
          )
          print("=" * 60)

          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gdelt.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update GDELT data"
            git push
          fi
