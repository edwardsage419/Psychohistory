name: Update GDELT Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  update-gdelt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GDELT data
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          topics = {
              "Economic": '"economic" OR "recession" OR "GDP" OR "interest rate"',
              "Geopolitics": '"geopolitics" OR "sanctions" OR "diplomatic"',
              "Technology": '"technology" OR "semiconductor" OR "robotics"',
              "Energy": '"energy" OR "oil price" OR "natural gas"',
              "War & Conflict": '"war" OR "armed conflict" OR "military"',
              "Inflation": '"inflation" OR "consumer prices" OR "cost of living"',
              "AI": '"artificial intelligence" OR "generative AI" OR "machine learning"'
          }

          results = {}

          for topic, query in topics.items():
              print(f"Fetching {topic}...")

              params = urllib.parse.urlencode({
                  "query": query,
                  "mode": "timelinevolraw",
                  "timespan": "7d",
                  "format": "json"
              })

              url = (
                  "https://api.gdeltproject.org/api/v2/doc/doc?"
                  + params
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Psychohistory/0.2"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:
                      raw = response.read()

                  data = json.loads(raw)

                  points = []

                  if (
                      isinstance(data, dict)
                      and isinstance(data.get("timeline"), list)
                      and len(data["timeline"]) > 0
                  ):
                      series = data["timeline"][0]

                      if isinstance(series, dict):
                          series_data = series.get("data", [])

                          if isinstance(series_data, list):
                              points = series_data

                  results[topic] = {
                      "success": True,
                      "points": points
                  }

                  print(
                      f"{topic}: {len(points)} data points"
                  )

              except Exception as e:
                  print(f"{topic}: ERROR: {e}")

                  results[topic] = {
                      "success": False,
                      "error": str(e),
                      "points": []
                  }

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source": "GDELT DOC 2.0",
              "timespan": "7d",
              "topics": results
          }

          with open(
              "data/gdelt.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("GDELT data saved.")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gdelt.json

          git diff --cached --quiet || \
            git commit -m "Update GDELT data"

          git push
