name: Update GDELT Data

on:
  schedule:
    # Runs once a day at 16:00 UTC. GitHub's scheduler can be delayed
    # by a few / up to ~30 minutes during high load — this is normal.
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # lets you trigger this manually from the Actions tab

permissions:
  contents: write   # needed to commit data/gdelt.json back to the repo

concurrency:
  group: update-gdelt
  cancel-in-progress: false   # never cancel a run that's already writing data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No requirements.txt — the script only uses the Python
          # standard library, so there is nothing to install and
          # nothing that can fail to install.

      - name: Run GDELT update script
        run: python scripts/update_gdelt.py

      - name: Commit and push updated data
        run: |
          git config user.name "psychohistory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gdelt.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GDELT data ($(date -u +%Y-%m-%d))"
            git push
          fi
